services:
  collector:
    build: .
    container_name: bkk_collector
    restart: unless-stopped
    init: true
    env_file:
      - .env
    volumes:
      - ./data:/data
    mem_limit: ${COLLECTOR_MEMORY_LIMIT:-1536m}
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  maintenance:
    build: .
    container_name: bkk_maintenance
    restart: unless-stopped
    init: true
    command: ["python", "-u", "maintenance.py"]
    env_file:
      - .env
    volumes:
      - ./data:/data
    mem_limit: ${MAINTENANCE_MEMORY_LIMIT:-1536m}
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "maintenance_healthcheck.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
