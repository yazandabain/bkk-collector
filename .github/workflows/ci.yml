name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s public_exporter/tests -v
      - run: docker build -f Dockerfile.public -t bkk-public-exporter:ci .
      - run: docker run --rm --network none bkk-public-exporter:ci python -m public_exporter --help
      - run: cp .env.public.example .env.public
      - run: docker compose -f docker-compose.public.yml run --build --rm --no-deps public-exporter python -m public_exporter --help

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run worker:check
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
